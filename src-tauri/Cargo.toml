[package]
name = "playdub"
version = "0.1.0"
description = "Local-first video playback with on-device transcription and translation"
authors = ["Playdub contributors"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/James-Leong/playdub"
rust-version = "1.85"

[lib]
name = "playdub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
getrandom = "0.3.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
