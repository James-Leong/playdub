name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Playdub solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior rather than a specific implementation when possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Areas affected
      options:
        - label: Playback or media formats
        - label: ASR, translation, or models
        - label: Privacy or networking
        - label: Accessibility
        - label: Packaging or distribution
        - label: Dependency or license policy
  - type: textarea
    id: licensing
    attributes:
      label: Dependency/model licensing
      description: List proposed upstream projects and licenses, if any. Do not attach model weights.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
